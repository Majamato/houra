[package]
name = "houra"
description = "A local-first GNOME time tracker"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
default-run = "houra"

[features]
default = []
native-ui = ["dep:gio", "dep:glib", "dep:gtk", "dep:libadwaita"]

[dependencies]
chrono.workspace = true
csv.workspace = true
directories.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
houra-core = { path = "../core" }
gio = { workspace = true, optional = true }
glib = { workspace = true, optional = true }
gtk = { workspace = true, optional = true }
libadwaita = { workspace = true, optional = true }
tempfile.workspace = true

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
