# Builds and tests every package for a version tag and drafts the GitHub
# release. Publishing the draft is the manual gate; published.yml takes over.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  version:
    name: Tag matches the version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Compare the tag with meson.build
        run: |
          version=$(sed -n "s/^  version: '\(.*\)',$/\1/p" meson.build)
          if [[ $GITHUB_REF_NAME != "v$version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match version $version in meson.build" >&2
            exit 1
          fi

  packages:
    name: Packages
    needs: version
    uses: ./.github/workflows/packages.yml

  draft:
    name: Draft the GitHub release
    needs: packages
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          path: artifacts
      - name: Collect the release assets
        run: |
          mkdir assets
          cp artifacts/sources/houra-*.tar.xz artifacts/binary/houra-*.tar.xz \
            artifacts/deb/houra_*_amd64.deb assets/
          cp scripts/install.sh assets/
          (cd assets && sha256sum -- * > SHA256SUMS)
          cat assets/SHA256SUMS
      - uses: actions/attest-build-provenance@v3
        with:
          subject-path: assets/*
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag \
            --title "Houra ${GITHUB_REF_NAME#v}" --generate-notes assets/*
