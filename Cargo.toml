[workspace]
members = ["crates/core", "crates/app"]
resolver = "3"

# Values shared by every member crate that opts in with `key.workspace = true`.
[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "GPL-3.0-or-later"
authors = ["majamato"]
repository = "https://github.com/majamato/work-time-tracker"

# Dependency catalog.
[workspace.dependencies]
chrono = { version = "0.4.41", features = ["serde"] }
csv = "1.3.1"
directories = "6.0.0"
gio = "0.21.2"
glib = "0.21.3"
gtk = { package = "gtk4", version = "0.10.1", features = ["v4_12"] }
libadwaita = { version = "0.8.0", features = ["v1_5"] }
proptest = "1.7.0"
rusqlite = { version = "0.37.0", features = ["backup", "bundled"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
tempfile = "3.21.0"
thiserror = "2.0.16"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
